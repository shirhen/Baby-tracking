name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Sync turns on when Firebase config is present: either committed as app/google-services.json,
      # or stored in the GOOGLE_SERVICES_JSON repository secret (paste the file's full contents).
      - name: Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config written from secret"
          fi
          if [ -f app/google-services.json ]; then echo "Sync: ON"; else echo "Sync: OFF (no google-services.json)"; fi

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "BabyTracker-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BabyTracker-1.0.${{ github.run_number }}
          path: BabyTracker-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: גרסה 1.0.${{ github.run_number }}
          body: "להורדה מהטלפון: לחצו על קובץ ה-APK למטה ואשרו התקנה."
          files: BabyTracker-*.apk
          make_latest: true
